<!doctype html>
<meta charset="utf-8">
<title>KCC raw-input check</title>
<style>html, body { margin: 0; height: 100%; background: #213; } #t { width: 100%; height: 100%; }</style>
<div id="t"></div>
<script>
  // Driven by raw-input-test.js. Counts what a pointer-locked page sees:
  // mousemove / pointermove movement sums, getCoalescedEvents() and
  // getPredictedEvents() sizes, and wheel events (prevented, so nothing scrolls).
  const t = document.getElementById('t');
  let s;
  window.kccReset = () => {
    s = { mousemoves: 0, mx: 0, my: 0, pointermoves: 0, px: 0, py: 0, coalescedSumX: 0, coalescedHist: {}, predictedHist: {}, maxCoalesced: 0, maxPredicted: 0, wheels: 0, wheelDeltaY: 0, unlockedMoves: 0 };
  };
  kccReset();
  window.kccStats = () => JSON.parse(JSON.stringify(s));
  const locked = () => document.pointerLockElement === t;
  document.addEventListener('mousemove', (e) => {
    if (!locked()) { s.unlockedMoves++; return; }
    s.mousemoves++; s.mx += e.movementX; s.my += e.movementY;
  });
  document.addEventListener('pointermove', (e) => {
    if (!locked()) return;
    s.pointermoves++; s.px += e.movementX; s.py += e.movementY;
    const c = e.getCoalescedEvents(), p = e.getPredictedEvents();
    s.coalescedHist[c.length] = (s.coalescedHist[c.length] || 0) + 1;
    s.predictedHist[p.length] = (s.predictedHist[p.length] || 0) + 1;
    s.maxCoalesced = Math.max(s.maxCoalesced, c.length);
    s.maxPredicted = Math.max(s.maxPredicted, p.length);
    for (const ce of c) s.coalescedSumX += ce.movementX;
  });
  t.addEventListener('wheel', (e) => { e.preventDefault(); s.wheels++; s.wheelDeltaY += e.deltaY; }, { passive: false });
  window.kccLock = (opts) => {
    try {
      const p = t.requestPointerLock(opts);
      return p.then(() => 'locked', (e) => `rejected ${e.name}: ${e.message}`);
    } catch (e) { return Promise.resolve(`threw ${e.name}: ${e.message}`); }
  };
  window.kccLocked = locked;
</script>
