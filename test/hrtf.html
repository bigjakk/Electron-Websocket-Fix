<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>hrtf</title></head>
<body style="margin:0;background:#222;color:#ccc;font:12px monospace">
<pre id="out">hrtf</pre>
<script>
// c41 check page. Renders HRTF panners (and one equal-power panner as a
// control) fed by oscillators, with listener and panner positions and listener
// orientation automated by setTargetAtTime, setValueAtTime and
// linearRampToValueAtTime, and returns a hash of the rendered samples (bit
// patterns) plus the raw buffer. Runs with and without
// KccHrtfPannerKRateAngles must be identical sample for sample.
//
// Every panner renders in its own OfflineAudioContext with a single
// source -> gain -> panner -> destination chain. When several panners feed one
// destination, the order in which AudioNodeInput sums its connections follows
// pointer hashing, so two runs of the SAME build differ by one float ulp once
// three or more inputs are non-zero (measured on stock 45.0.0-alpha.14:
// max |diff| 5.96e-8). One input per destination removes that noise.
'use strict';
const RATE = 48000, SECONDS = 4;

function fnv(h, x) { for (let k = 0; k < 4; k++) { h ^= (x >>> (8 * k)) & 255; h = Math.imul(h, 16777619) >>> 0; } return h; }

function automateListener(L) {
  L.positionX.setValueAtTime(0, 0);
  L.positionX.linearRampToValueAtTime(3, 1.5);
  L.positionX.setTargetAtTime(-2, 1.5, 0.3);
  L.positionZ.setTargetAtTime(1.5, 0.2, 0.5);
  L.forwardX.setTargetAtTime(0.7, 0.5, 0.2);
  L.forwardZ.setValueAtTime(-1, 0);
  L.forwardZ.linearRampToValueAtTime(-0.3, 3.0);
  L.upY.setTargetAtTime(0.9, 1.0, 0.4);
  for (let t = 0; t < SECONDS; t += 1 / 60) {  // per-frame updates like Howler in a game
    L.positionY.setTargetAtTime(Math.sin(t * 2.1) * 0.5, t, 0.1);
  }
}

async function renderOne(i, model) {
  const ctx = new OfflineAudioContext(2, RATE * SECONDS, RATE);
  automateListener(ctx.listener);
  const osc = ctx.createOscillator();
  osc.type = ['sine', 'square', 'sawtooth', 'triangle', 'sine'][i];
  osc.frequency.value = 110 * (i + 1) + 7;
  const p = ctx.createPanner();
  p.panningModel = model;
  p.distanceModel = 'inverse';
  p.positionX.setValueAtTime(Math.cos(i) * 3, 0);
  p.positionX.linearRampToValueAtTime(-Math.cos(i) * 3, SECONDS);
  p.positionZ.setValueAtTime(Math.sin(i) * 3, 0);
  p.positionZ.setTargetAtTime(-1 - i * 0.5, 1 + i * 0.3, 0.25);
  p.positionY.setValueAtTime(0.2 * i, 2.0);
  const g = ctx.createGain(); g.gain.value = 0.5;
  osc.connect(g).connect(p).connect(ctx.destination);
  osc.start(0.01 * i);
  return ctx.startRendering();
}

async function run() {
  const models = ['HRTF', 'HRTF', 'HRTF', 'HRTF', 'equalpower'];
  let h = 2166136261 >>> 0, nonZero = 0, peak = 0;
  const parts = [], perPanner = [];
  for (let i = 0; i < models.length; i++) {
    const buf = await renderOne(i, models[i]);
    let hp = 2166136261 >>> 0;
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      const u = new Uint32Array(d.buffer, d.byteOffset, d.length);
      for (let k = 0; k < u.length; k++) {
        h = fnv(h, u[k]); hp = fnv(hp, u[k]);
        if (d[k] !== 0) nonZero++;
        peak = Math.max(peak, Math.abs(d[k]));
      }
      parts.push(new Uint8Array(d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength)));
    }
    perPanner.push({ model: models[i], hash: hp.toString(16) });
  }
  const all = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let off = 0;
  for (const p of parts) { all.set(p, off); off += p.length; }
  let bin = '';
  for (let i = 0; i < all.length; i += 0x8000) bin += String.fromCharCode.apply(null, all.subarray(i, i + 0x8000));
  return { hash: h.toString(16), perPanner, framesPerContext: RATE * SECONDS, nonZero, peak, rawBase64: btoa(bin) };
}
window.kccResult = run().catch((e) => ({ error: String(e && e.stack || e) }));
</script>
</body>
</html>
