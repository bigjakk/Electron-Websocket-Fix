# Xorg configuration for running the tests on a Linux machine without a GPU or
# a desktop session (used by linux-x11-env.sh).
#
# - Video: the "dummy" driver (xserver-xorg-video-dummy), one 1920x1080 screen
#   at 60 Hz. No GPU: Chromium renders in software.
# - Input: hot-plugged through udev and libinput (xserver-xorg-input-libinput),
#   as on a desktop. linux-vmouse.py adds a uinput relative mouse,
#   "kcc-virtual-mouse", which therefore goes through the real device path:
#   libinput pointer acceleration applies to its core motion, and XInput2 raw
#   events carry the unaccelerated deltas. The machine's own input devices
#   (on a VM: a PS/2 keyboard, an absolute USB tablet, a VMMouse) are added
#   too, as they would be on a desktop.
# - No compositing window manager: run openbox (linux-x11-env.sh does).

Section "ServerFlags"
    Option "AutoAddDevices"   "true"
    Option "AutoEnableDevices" "true"
    Option "AutoAddGPU"       "false"
    Option "DontVTSwitch"     "true"
    Option "BlankTime"        "0"
    Option "StandbyTime"      "0"
    Option "SuspendTime"      "0"
    Option "OffTime"          "0"
EndSection

Section "Device"
    Identifier "dummy-video"
    Driver     "dummy"
    VideoRam   256000
EndSection

Section "Monitor"
    Identifier  "dummy-monitor"
    HorizSync   5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    # CVT 1920x1080 at 60 Hz
    Modeline "1920x1080_60" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier   "dummy-screen"
    Device       "dummy-video"
    Monitor      "dummy-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "dummy-layout"
    Screen     "dummy-screen"
EndSection

# The virtual mouse made by linux-vmouse.py: make sure libinput drives it.
Section "InputClass"
    Identifier   "kcc virtual mouse"
    MatchProduct "kcc-virtual-mouse"
    Driver       "libinput"
EndSection
