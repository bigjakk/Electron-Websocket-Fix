<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>frame-cap</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 8px; top: 8px; color: #0f0; font: 12px monospace;
         background: rgba(0,0,0,.6); padding: 4px 6px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// Counts requestAnimationFrame callbacks for the frame-cap gate.
//   ?busy=<ms>   spin this long inside every rAF callback (a page that cannot
//                reach a high cap)
//   ?label=<s>   shown in the HUD; lets two views in one window be told apart
// The page draws every frame (WebGL2 clear, 2D fill if WebGL2 is missing) so
// that every frame carries damage and reaches a swap.
//   ?mode=webgl  draw with WebGL2 (default); mode=2d uses a 2D canvas, which on
//                a machine without a GPU avoids the per-frame WebGL readback and
//                leaves more headroom above the caps under test
const params = new URLSearchParams(location.search);
const busyMs = parseFloat(params.get('busy') || '0');
const label = params.get('label') || 'main';
const mode = params.get('mode') || 'webgl';
const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const gl = mode === 'webgl' ? canvas.getContext('webgl2', { antialias: false, alpha: false }) : null;
const ctx2d = gl ? null : canvas.getContext('2d', { alpha: false });

let frames = 0;
let pending = null;  // active measurement

function fitCanvas() {
  const w = Math.max(1, Math.floor(innerWidth * devicePixelRatio));
  const h = Math.max(1, Math.floor(innerHeight * devicePixelRatio));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

function percentile(sorted, p) {
  if (!sorted.length) return 0;
  return sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))];
}

function frame() {
  const now = performance.now();
  frames++;
  if (pending) {
    const m = pending;
    if (m.t0 === undefined) {
      m.t0 = now; m.f0 = frames; m.last = now;
    } else {
      m.intervals.push(now - m.last);
      m.last = now;
      if (now - m.t0 >= m.ms) {
        pending = null;
        const iv = m.intervals.slice().sort((a, b) => a - b);
        const mean = iv.reduce((a, b) => a + b, 0) / iv.length;
        const sd = Math.sqrt(iv.reduce((a, b) => a + (b - mean) * (b - mean), 0) / iv.length);
        m.resolve({
          label, fps: (frames - m.f0) * 1000 / (now - m.t0), frames: frames - m.f0,
          elapsedMs: now - m.t0, meanMs: mean, sdMs: sd,
          p01Ms: percentile(iv, 0.01), p50Ms: percentile(iv, 0.5),
          p99Ms: percentile(iv, 0.99), maxMs: iv[iv.length - 1],
        });
      }
    }
  }
  if (busyMs > 0) {
    const end = now + busyMs;
    while (performance.now() < end) { /* simulated render work */ }
  }
  fitCanvas();
  const c = (frames & 255) / 255;
  if (gl) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(c, 1 - c, 0.5, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  } else {
    ctx2d.fillStyle = `rgb(${(c * 255) | 0},${(255 - c * 255) | 0},128)`;
    ctx2d.fillRect(0, 0, canvas.width, canvas.height);
  }
  if ((frames & 63) === 0) hud.textContent = `${label} ${gl ? 'webgl2' : '2d'} busy=${busyMs}ms frames=${frames}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.kcc = {
  label,
  renderer: gl ? 'webgl2' : '2d',
  frames: () => frames,
  // Counts rAF callbacks for `ms` milliseconds, starting at the next callback
  // and ending at the first callback at or after `ms`.
  measure: (ms) => new Promise((resolve) => {
    pending = { ms, resolve, intervals: [] };
  }),
};
</script>
</body>
</html>
